name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip | sort | tail -n 1)
          echo "Using archive: $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          ROOT=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Error summary
        if: steps.build.outcome == 'failure'
        run: |
          echo "================ ERROR SUMMARY ================"
          grep -nE "^e: |^w: .*error|error:|Unresolved reference|Caused by|What went wrong|FAILURE:|Execution failed for task" build.log \
            | grep -v "warning" | head -n 60
          echo "==============================================="
          {
            echo "## Error summary"
            echo '```'
            grep -nE "^e: |error:|Unresolved reference|Caused by|What went wrong|FAILURE:|Execution failed for task" build.log | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        if: steps.build.outcome == 'success'
        run: |
          find "$PROJECT_ROOT" -name "*.apk" -exec cp {} ZiziPlayer.apk \;
          ls -lh ZiziPlayer.apk

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ZiziPlayer-APK
          path: ZiziPlayer.apk
          retention-days: 30

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
