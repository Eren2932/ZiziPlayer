name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "Using archive: $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          ROOT=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
          echo "Project root: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          find "$PROJECT_ROOT" -name "*.apk" -exec cp {} ZiziPlayer.apk \;
          ls -lh ZiziPlayer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZiziPlayer-APK
          path: ZiziPlayer.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/reports/**
