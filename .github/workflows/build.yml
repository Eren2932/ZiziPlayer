name: Build & release ZiziPlayer APK

# Репозиторий устроен как «код лежит в zip-архиве в корне». Поэтому workflow сначала
# распаковывает самый свежий zip, а потом собирает проект из него. Workflow, лежащий
# ВНУТРИ zip, GitHub никогда не запускает: он читает только .github/workflows в корне.

on:
  workflow_dispatch:
    inputs:
      attach_to_tag:
        description: 'Прикрепить APK к уже существующему релизу с этим тегом (например v6.11.0). Пусто — просто собрать.'
        required: false
        default: ''
  push:
    branches: [main, master]
    tags: ['v*']
  release:
    types: [published]

# Без этого softprops/action-gh-release получает 403: у GITHUB_TOKEN по умолчанию
# может не быть права записи в Releases.
permissions:
  contents: write

concurrency:
  group: zizi-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::в корне репозитория нет ни одного .zip — собирать нечего"
            exit 1
          fi
          ZIP=$(printf '%s\n' "${zips[@]}" | sort -V | tail -1)
          echo "::notice::собираю из $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          settings=$(find _src -name settings.gradle.kts | head -1)
          if [ -z "$settings" ]; then
            echo "::error::в архиве нет settings.gradle.kts — это не проект Gradle"
            exit 1
          fi
          root=$(dirname "$settings")
          echo "PROJECT_ROOT=$root" >> "$GITHUB_ENV"
          version=$(grep -oP 'versionName = "\K[^"]+' "$root/app/build.gradle.kts")
          code=$(grep -oP 'versionCode = \K[0-9]+' "$root/app/build.gradle.kts")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "::notice::версия $version (versionCode $code)"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      # Хранилище ключа едет в секретах как base64: бинарь в секрет иначе не положить.
      # На теге и на релизе отсутствие ключа — это ошибка, а не предупреждение: debug-APK,
      # выложенный как релиз, потом не даст установить нормально подписанное обновление.
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            if [ "${{ github.event_name }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 не задан, а это релизная сборка — останавливаюсь"
              exit 1
            fi
            echo "::warning::SIGNING_KEYSTORE_BASE64 не задан — APK уйдёт на debug-ключ (только для проверки сборки)"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          ls -l "$RUNNER_TEMP/release.jks"

      # continue-on-error здесь нет намеренно: зелёная галочка на провалившейся сборке
      # хуже отсутствия CI, потому что учит доверять галочке.
      - name: Assemble release
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          RESOLVER_URL: ${{ vars.RESOLVER_URL }}
          RESOLVER_TOKEN: ${{ secrets.RESOLVER_TOKEN }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Error summary
        if: failure()
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          {
            echo "## Что сломалось"
            echo '```'
            grep -nE "^e: |error:|Unresolved reference|Caused by|What went wrong|FAILURE:|Execution failed for task" build.log | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Проверка, а не украшение: apksigner называет владельца сертификата.
      - name: Verify signature
        run: |
          set -euo pipefail
          apk=$(find "$PROJECT_ROOT/app/build/outputs/apk/release" -name '*.apk' | head -1)
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$signer" verify --print-certs "$apk" | grep -E 'certificate DN|SHA-256' || true
          if "$signer" verify --print-certs "$apk" | grep -q 'CN=Android Debug'; then
            if [ "${{ github.event_name }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "::error::APK подписан debug-ключом — такой релиз выкладывать нельзя"
              exit 1
            fi
            echo "::warning::APK подписан debug-ключом"
          else
            echo "::notice::подпись релизная"
          fi

      - name: Rename artifact
        run: |
          set -euo pipefail
          apk=$(find "$PROJECT_ROOT/app/build/outputs/apk/release" -name '*.apk' | head -1)
          cp "$apk" "ZiziPlayer-v${APP_VERSION}.apk"
          ls -lh ZiziPlayer-v*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZiziPlayer-APK-v${{ env.APP_VERSION }}
          path: ZiziPlayer-v*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 30

      # Один шаг на три сценария: push тега, публикация релиза через веб-морду,
      # и ручной догон уже существующего релиза (attach_to_tag).
      - name: Determine release tag
        id: rel
        run: |
          tag=""
          case "${{ github.event_name }}" in
            push)     [[ "${{ github.ref }}" == refs/tags/* ]] && tag="${{ github.ref_name }}" ;;
            release)  tag="${{ github.event.release.tag_name }}" ;;
            workflow_dispatch) tag="${{ github.event.inputs.attach_to_tag }}" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] && echo "::notice::APK поедет в релиз $tag" || echo "::notice::релиз не трогаю, APK только в артефактах"

      - name: Attach APK to release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: ZiziPlayer-v*.apk
          fail_on_unmatched_files: true
